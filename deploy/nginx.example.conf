# /etc/nginx/sites-available/car-service (PLAN 17)
# The Mini App, the panel and the API on one HTTPS origin: Telegram opens Mini Apps only over
# HTTPS, and the panel's cookie needs the API on its own origin. Replace car.example.uz everywhere
# and set the same address as PUBLIC_URL in /etc/car-service.env.

# Ends at the path: a query string can hold a client's name or phone from the search box.
log_format carservice '$remote_addr [$time_local] "$request_method $uri" $status '
                      '$body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name car.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name car.example.uz;

    # Written by: certbot --nginx -d car.example.uz
    ssl_certificate     /etc/letsencrypt/live/car.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/car.example.uz/privkey.pem;

    access_log /var/log/nginx/car-service.access.log carservice;
    # Below this level nginx writes the whole request line when the app is down, search included.
    # An outage still shows as 502 in the access log and in journalctl.
    error_log /var/log/nginx/car-service.error.log crit;

    # A photo is at most 3 MB (PLAN 4.9); a little more, so that the app gives the error, not nginx.
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # brotli needs the ngx_brotli module; uncomment if it is installed.
    # brotli on;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    # Every response, also the ones the locations below add their own headers to (add_header is not
    # inherited once a location has one, hence `always` and the repeats there).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # The API and the photo links. Host must be passed on: the API compares a changing request's
    # Origin with it, and without it every change in the panel is refused (PLAN 15).
    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health {
        proxy_pass http://127.0.0.1:3300;
        access_log off;
    }

    # `/admin` without the slash would fall to the Mini App below; the panel's "Bugun" links there.
    location = /admin {
        return 301 /admin/$is_args$args;
    }

    # The panel (npm run build: apps/admin/dist). It is never shown inside another site.
    location /admin/assets/ {
        alias /opt/car-service/apps/admin/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /admin/ {
        alias /opt/car-service/apps/admin/dist/;
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # The Mini App (apps/tma/dist). No X-Frame-Options here: Telegram Web shows it in an iframe.
    root /opt/car-service/apps/tma/dist;
    # File names contain a hash of their content, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # Must always be checked, or an update would not reach anyone until their cache expired.
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
